<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 730">
  <style>
    :root {
      --bg: #0f172a;
      --bg-grid: #1e293b;
      --mask: #0f172a;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --arrow: #64748b;
      --color-primary-fill: rgba(8,51,68,0.4);
      --color-primary-stroke: #22d3ee;
      --color-secondary-fill: rgba(6,78,59,0.4);
      --color-secondary-stroke: #34d399;
      --color-tertiary-fill: rgba(76,29,149,0.4);
      --color-tertiary-stroke: #a78bfa;
      --color-accent-fill: rgba(120,53,15,0.3);
      --color-accent-stroke: #fbbf24;
      --color-alert-fill: rgba(136,19,55,0.4);
      --color-alert-stroke: #fb7185;
      --color-connector-fill: rgba(251,146,60,0.3);
      --color-connector-stroke: #fb923c;
      --color-neutral-fill: rgba(30,41,59,0.5);
      --color-neutral-stroke: #94a3b8;
      --color-highlight-fill: rgba(59,130,246,0.3);
      --color-highlight-stroke: #60a5fa;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-accent-stroke)"/>
    </marker>
    <marker id="arrow-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-highlight-stroke)"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="var(--arrow)" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="36" fill="var(--text)" font-size="16" font-weight="700">AgentScope-AP 系统架构</text>
  <text x="40" y="56" fill="var(--text-muted)" font-size="9">多 Agent · 多租户 · SOP · 混合知识库（MinIO + Milvus 已接入）· Qdrant 保留回滚路径</text>

  <!-- arrows: row2 -> row3 -->
  <path d="M 480,256 L 480,274 L 210,274 L 210,298" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="345" y="268" fill="var(--text-muted)" font-size="8" text-anchor="middle">平台认证 / 租户路由</text>
  <path d="M 590,256 L 590,298" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="598" y="282" fill="var(--text-muted)" font-size="8">内核路由</text>
  <path d="M 700,256 L 700,274 L 930,274 L 930,298" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="815" y="268" fill="var(--text-muted)" font-size="8" text-anchor="middle">检索统一入口</text>

  <!-- arrows: row1 -> row2 -->
  <path d="M 590,148 L 590,190" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="598" y="174" fill="var(--text-muted)" font-size="8">Authorization Bearer JWT</text>

  <!-- arrows: shell <-> kernel <-> hybrid -->
  <path d="M 370,352 L 406,352" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="388" y="344" fill="var(--text-muted)" font-size="7.5" text-anchor="middle">装配</text>
  <path d="M 730,352 L 766,352" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="748" y="344" fill="var(--text-muted)" font-size="7.5" text-anchor="middle">检索</text>

  <!-- arrows: kernel -> data layer -->
  <path d="M 450,402 L 450,432 L 150,432 L 150,464" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="426" fill="var(--text-muted)" font-size="8" text-anchor="middle">storage</text>
  <path d="M 500,402 L 500,414 L 380,414 L 380,464" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="440" y="409" fill="var(--text-muted)" font-size="8" text-anchor="middle">message bus</text>
  <path d="M 610,402 L 610,464" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="618" y="440" fill="var(--text-muted)" font-size="8">blob</text>
  <path d="M 700,402 L 700,432 L 800,432 L 800,464" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="426" fill="var(--text-muted)" font-size="8" text-anchor="middle">vector</text>

  <!-- arrows: hybrid -> Milvus / PG -->
  <path d="M 870,402 L 870,464" fill="none" stroke="var(--color-highlight-stroke)" stroke-width="1.4" marker-end="url(#arrow-highlight)"/>
  <text x="878" y="440" fill="var(--color-highlight-stroke)" font-size="8">语义召回</text>
  <path d="M 800,402 L 800,458 L 200,458 L 200,464" fill="none" stroke="var(--color-accent-stroke)" stroke-width="1.2" stroke-dasharray="6,3" stroke-opacity="0.75" marker-end="url(#arrow-accent)"/>
  <text x="500" y="452" fill="var(--color-accent-stroke)" font-size="8" text-anchor="middle">关键词召回 / 发布可见性</text>

  <!-- arrows: shell -> workspace ; Milvus -> Qdrant -->
  <path d="M 210,402 L 210,580 L 380,580 L 380,596" fill="none" stroke="var(--arrow)" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="295" y="574" fill="var(--text-muted)" font-size="8" text-anchor="middle">隔离工作区</text>
  <path d="M 840,556 L 840,582 L 610,582 L 610,596" fill="none" stroke="var(--arrow)" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
  <text x="725" y="576" fill="var(--text-muted)" font-size="8" text-anchor="middle">VECTOR_BACKEND 可切换</text>

  <!-- row1: browser -->
  <rect x="480" y="84" width="220" height="64" rx="6" fill="var(--mask)"/>
  <rect x="480" y="84" width="220" height="64" rx="6" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="590" y="112" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">浏览器 · 前端 UI</text>
  <text x="590" y="130" fill="var(--text-muted)" font-size="8" text-anchor="middle">React 19 + Vite · localhost:5173</text>

  <!-- row2: FastAPI -->
  <rect x="380" y="192" width="420" height="64" rx="6" fill="var(--mask)"/>
  <rect x="380" y="192" width="420" height="64" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="590" y="220" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">FastAPI 后端 · :8000</text>
  <text x="590" y="238" fill="var(--text-muted)" font-size="8" text-anchor="middle">JwtAuthMiddleware 校验 JWT · 注入 X-User-ID</text>

  <!-- row3: platform shell -->
  <rect x="50" y="302" width="320" height="100" rx="6" fill="var(--mask)"/>
  <rect x="50" y="302" width="320" height="100" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="210" y="330" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">平台壳 app/platform</text>
  <text x="210" y="350" fill="var(--text-muted)" font-size="9" text-anchor="middle">认证 · 多租户 · 缓存</text>
  <text x="210" y="366" fill="var(--text-muted)" font-size="9" text-anchor="middle">工作区隔离 · 工具绑定白名单</text>
  <text x="210" y="386" fill="var(--text-muted)" font-size="8" text-anchor="middle">审计 · 租户资源共享</text>

  <!-- row3: AgentScope kernel -->
  <rect x="410" y="302" width="320" height="100" rx="6" fill="var(--mask)"/>
  <rect x="410" y="302" width="320" height="100" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="570" y="330" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">AgentScope 内核 create_app</text>
  <text x="570" y="350" fill="var(--text-muted)" font-size="9" text-anchor="middle">Agent · 会话 · SOP · 知识库</text>
  <text x="570" y="366" fill="var(--text-muted)" font-size="9" text-anchor="middle">MCP · Skill · 渠道路由</text>
  <text x="570" y="386" fill="var(--text-muted)" font-size="8" text-anchor="middle">API / IndexWorker / Scheduler 按 SERVICE_ROLE 分角色</text>

  <!-- row3: hybrid knowledge (highlight) -->
  <rect x="770" y="302" width="320" height="100" rx="6" fill="var(--mask)"/>
  <rect x="770" y="302" width="320" height="100" rx="6" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1.5"/>
  <text x="930" y="330" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">HybridKnowledgeBaseManager</text>
  <text x="930" y="350" fill="var(--text-muted)" font-size="9" text-anchor="middle">双路召回：PG 关键词 + Milvus 语义</text>
  <text x="930" y="366" fill="var(--text-muted)" font-size="9" text-anchor="middle">RRF 融合 · 发布可见性过滤</text>
  <text x="930" y="386" fill="var(--text-muted)" font-size="8" text-anchor="middle">UI 与 Agent 共用同一检索逻辑</text>

  <!-- row4: PostgreSQL -->
  <ellipse cx="150" cy="480" rx="100" ry="12" fill="var(--mask)"/>
  <ellipse cx="150" cy="540" rx="100" ry="12" fill="var(--mask)"/>
  <rect x="50" y="480" width="200" height="60" fill="var(--mask)"/>
  <rect x="50" y="480" width="200" height="60" fill="var(--color-tertiary-fill)"/>
  <ellipse cx="150" cy="480" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <ellipse cx="150" cy="540" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="50" y1="480" x2="50" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="250" y1="480" x2="250" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="150" y="506" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL :5432</text>
  <text x="150" y="522" fill="var(--text-muted)" font-size="8" text-anchor="middle">ap_* 平台表 · 内核表</text>
  <text x="150" y="536" fill="var(--text-muted)" font-size="8" text-anchor="middle">关键词召回 · 发布可见性</text>

  <!-- row4: Redis -->
  <ellipse cx="380" cy="480" rx="100" ry="12" fill="var(--mask)"/>
  <ellipse cx="380" cy="540" rx="100" ry="12" fill="var(--mask)"/>
  <rect x="280" y="480" width="200" height="60" fill="var(--mask)"/>
  <rect x="280" y="480" width="200" height="60" fill="var(--color-tertiary-fill)"/>
  <ellipse cx="380" cy="480" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <ellipse cx="380" cy="540" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="280" y1="480" x2="280" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="480" y1="480" x2="480" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="380" y="506" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">Redis :6380</text>
  <text x="380" y="522" fill="var(--text-muted)" font-size="8" text-anchor="middle">缓存 · MessageBus</text>
  <text x="380" y="536" fill="var(--text-muted)" font-size="8" text-anchor="middle">工作区创建锁</text>

  <!-- row4: MinIO -->
  <ellipse cx="610" cy="480" rx="100" ry="12" fill="var(--mask)"/>
  <ellipse cx="610" cy="540" rx="100" ry="12" fill="var(--mask)"/>
  <rect x="510" y="480" width="200" height="60" fill="var(--mask)"/>
  <rect x="510" y="480" width="200" height="60" fill="var(--color-tertiary-fill)"/>
  <ellipse cx="610" cy="480" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <ellipse cx="610" cy="540" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="510" y1="480" x2="510" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="710" y1="480" x2="710" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="610" y="506" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">MinIO :9000</text>
  <text x="610" y="522" fill="var(--text-muted)" font-size="8" text-anchor="middle">S3 Blob 原文存储</text>
  <text x="610" y="536" fill="var(--text-muted)" font-size="8" text-anchor="middle">索引重建基础 · path-style</text>

  <!-- row4: Milvus -->
  <ellipse cx="840" cy="480" rx="100" ry="12" fill="var(--mask)"/>
  <ellipse cx="840" cy="540" rx="100" ry="12" fill="var(--mask)"/>
  <rect x="740" y="480" width="200" height="60" fill="var(--mask)"/>
  <rect x="740" y="480" width="200" height="60" fill="var(--color-tertiary-fill)"/>
  <ellipse cx="840" cy="480" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <ellipse cx="840" cy="540" rx="100" ry="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="740" y1="480" x2="740" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <line x1="940" y1="480" x2="940" y2="540" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="840" y="506" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">Milvus :19530</text>
  <text x="840" y="522" fill="var(--text-muted)" font-size="8" text-anchor="middle">语义向量召回</text>
  <text x="840" y="536" fill="var(--text-muted)" font-size="8" text-anchor="middle">kb_&lt;uuid&gt; Collection</text>

  <!-- row5: local workspace -->
  <rect x="280" y="600" width="200" height="60" rx="6" fill="var(--mask)"/>
  <rect x="280" y="600" width="200" height="60" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="380" y="626" fill="var(--text)" font-size="10" font-weight="600" text-anchor="middle">本地工作区 workspace/</text>
  <text x="380" y="642" fill="var(--text-muted)" font-size="8" text-anchor="middle">用户 × Agent 隔离</text>

  <!-- row5: Qdrant (rollback, dashed) -->
  <rect x="510" y="600" width="200" height="60" rx="6" fill="var(--mask)"/>
  <rect x="510" y="600" width="200" height="60" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="610" y="626" fill="var(--text)" font-size="10" font-weight="600" text-anchor="middle">Qdrant (legacy profile)</text>
  <text x="610" y="642" fill="var(--text-muted)" font-size="8" text-anchor="middle">可回滚向量后端</text>

  <!-- legend -->
  <rect x="960" y="598" width="16" height="10" rx="2" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1"/>
  <text x="982" y="607" fill="var(--text-muted)" font-size="8">前端 / 入口</text>
  <rect x="960" y="616" width="16" height="10" rx="2" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1"/>
  <text x="982" y="625" fill="var(--text-muted)" font-size="8">服务层</text>
  <rect x="960" y="634" width="16" height="10" rx="2" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1"/>
  <text x="982" y="643" fill="var(--text-muted)" font-size="8">数据存储</text>
  <rect x="960" y="652" width="16" height="10" rx="2" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
  <text x="982" y="661" fill="var(--text-muted)" font-size="8">混合检索链路</text>
  <rect x="960" y="670" width="16" height="10" rx="2" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="982" y="679" fill="var(--text-muted)" font-size="8">本地 / 可选回滚</text>

  <!-- footnote -->
  <text x="40" y="700" fill="var(--text-muted)" font-size="8">后台任务按 SERVICE_ROLE 角色运行（IndexWorker / ChannelWorker / Scheduler）· schema 由独立 migrate job 管理 · 运行时统一在 backend/app/runtime.py build_runtime() 装配</text>
</svg>
